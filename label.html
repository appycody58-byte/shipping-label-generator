<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Label</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #e8e8ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }
    .top {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn-track { background: #5e5ce6; color: #fff; }
    .btn-print { background: #007aff; color: #fff; margin-left: 8px; }

    .label {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .label-header {
      display: flex;
      border-bottom: 2px solid #000;
    }
    .from {
      flex: 1;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.35;
    }
    .from strong {
      display: block;
      font-size: 10px;
      margin-bottom: 3px;
      letter-spacing: 0.3px;
    }
    .shipper {
      width: 120px;
      padding: 10px;
      text-align: center;
      border-left: 1px solid #ddd;
      font-size: 10px;
    }
    .shipper .logo {
      font-weight: 800;
      font-size: 13px;
      color: #5e5ce6;
      line-height: 1.15;
      margin-top: 4px;
    }
    .to-section {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #000;
    }
    .to {
      flex: 1;
      font-size: 13px;
      line-height: 1.35;
    }
    .to strong {
      display: block;
      font-size: 10px;
      margin-bottom: 3px;
    }
    .fl {
      width: 56px;
      height: 56px;
      border: 3px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
    }
    .barcode-area {
      padding: 16px;
      text-align: center;
    }
    .tn {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-top: 6px;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    @media print {
      body { background: white; padding: 0; }
      .top, .hint { display: none !important; }
      .label { box-shadow: none; border: 1px solid #000; max-width: 4in; }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>Shipping Label</h1>
    <div>
      <a href="index.html" class="btn btn-track">Tracking Page</a>
      <button class="btn btn-print" onclick="window.print()">Print</button>
    </div>
  </div>

  <div class="label">
    <div class="label-header">
      <div class="from" contenteditable="true">
        <strong>FROM</strong>
        Houston, TX US
      </div>
      <div class="shipper">
        <div style="font-size:9px;color:#888;font-weight:600">SHIPPER</div>
        <div class="logo">SHIPPER<br>GLOBAL EXPRESS</div>
      </div>
    </div>
    <div class="to-section">
      <div class="to" contenteditable="true">
        <strong>TO</strong>
        Milton, FL US
      </div>
      <div class="fl">FL</div>
    </div>
    <div class="barcode-area">
      <svg id="bc"></svg>
      <div class="tn" id="tn">11881-87236-402382053</div>
    </div>
  </div>

  <div class="hint">This is the Label / Transit page · Different from the Tracking page</div>

  <script>
    JsBarcode('#bc', '1188187236402382053', {
      format: 'CODE128',
      width: 1.6,
      height: 48,
      displayValue: false,
      margin: 0,
      background: '#ffffff'
    });

    document.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('focus', () => el.style.outline = '2px solid #5e5ce6');
      el.addEventListener('blur', () => el.style.outline = 'none');
    });
  </script>
</body>
</html>
