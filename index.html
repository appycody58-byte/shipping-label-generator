<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Package Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
    }
    .topbar {
      background: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5ea;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar h1 { font-size: 17px; font-weight: 600; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-gray { background: #e5e5ea; color: #1c1c1e; }
    .btn-purple { background: #5e5ce6; color: #fff; }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .track-input-wrap {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .track-input-wrap label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8e8e93;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .track-row { display: flex; gap: 8px; }
    #trackingInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #d1d1d6;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
    }
    #trackingInput:focus { border-color: #5e5ce6; }
    .btn-go {
      padding: 0 18px;
      background: #5e5ce6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* ===== EXACT PROFESSIONAL TIMELINE ===== */
    .tracking-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 22px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      display: none;
    }
    .tracking-card.visible { display: block; animation: slideUp 0.35s ease; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .eta {
      font-size: 22px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 32px;
      letter-spacing: -0.3px;
    }

    .timeline {
      position: relative;
      padding-left: 32px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 10px;
      bottom: 40px;
      width: 4px;
      background: #e5e5ea;
      border-radius: 4px;
    }
    .timeline-progress {
      position: absolute;
      left: 9px;
      top: 10px;
      width: 4px;
      background: #5e5ce6;
      border-radius: 4px;
      z-index: 1;
      transition: height 0.45s ease;
    }

    .step {
      position: relative;
      padding-bottom: 28px;
    }
    .step:last-child { padding-bottom: 0; }

    .dot {
      position: absolute;
      left: -32px;
      top: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e5e5ea;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #e5e5ea;
      z-index: 3;
    }
    .step.done .dot {
      background: #5e5ce6;
      box-shadow: 0 0 0 2px #5e5ce6;
    }
    .step.current .dot {
      width: 28px;
      height: 28px;
      left: -38px;
      top: -4px;
      background: #5e5ce6;
      box-shadow: 0 0 0 6px rgba(94, 92, 230, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step.current .dot::after {
      content: '→';
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }
    .step.current {
      background: linear-gradient(90deg, rgba(94,92,230,0.07) 0%, transparent 100%);
      margin: 0 -14px 12px -14px;
      padding: 12px 14px 16px 46px;
      border-radius: 14px;
    }
    .step.current .dot { left: -24px; }

    .step-title {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.2px;
    }
    .step-sub {
      font-size: 14px;
      color: #3a3a3c;
      margin-top: 3px;
      line-height: 1.35;
    }
    .step-time {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 4px;
    }
    .step-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 14px;
      color: #5e5ce6;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Label section - different design */
    .label-section { margin-top: 28px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #8e8e93;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .label-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,0.05);
      border: 1px solid #e5e5ea;
    }
    .label-header { display: flex; border-bottom: 1px solid #e5e5ea; }
    .label-from {
      flex: 1;
      padding: 14px 16px;
      font-size: 12px;
      line-height: 1.4;
    }
    .label-from strong {
      display: block;
      font-size: 10px;
      color: #8e8e93;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .label-shipper {
      width: 110px;
      padding: 12px 10px;
      text-align: center;
      border-left: 1px solid #e5e5ea;
      font-size: 10px;
    }
    .label-shipper .logo {
      font-weight: 800;
      font-size: 12px;
      color: #5e5ce6;
      line-height: 1.15;
      margin-top: 4px;
    }
    .label-to {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #e5e5ea;
    }
    .label-to-text { flex: 1; font-size: 13px; line-height: 1.4; }
    .label-to-text strong {
      display: block;
      font-size: 10px;
      color: #8e8e93;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .fl {
      width: 52px; height: 52px;
      border: 2.5px solid #1c1c1e;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800;
    }
    .label-barcode { padding: 18px 16px; text-align: center; }
    .label-track-num {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-top: 8px;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Package Tracker</h1>
    <div class="topbar-actions">
      <button class="btn btn-gray" onclick="showLabel()">Label</button>
      <button class="btn btn-purple" onclick="document.getElementById('trackingInput').focus()">Track</button>
    </div>
  </div>

  <div class="container">
    <div class="track-input-wrap">
      <label>ENTER TRACKING NUMBER</label>
      <div class="track-row">
        <input type="text" id="trackingInput" placeholder="Paste or type tracking number" value="11861-87236-402392053">
        <button class="btn-go" onclick="doTrack()">Track</button>
      </div>
    </div>

    <!-- PROFESSIONAL IN-TRANSIT TIMELINE -->
    <div class="tracking-card" id="trackingCard">
      <div class="eta" id="etaText">By end of day</div>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- LABEL (different design) -->
    <div class="label-section" id="labelSection">
      <div class="section-title">Shipping Label</div>
      <div class="label-card">
        <div class="label-header">
          <div class="label-from" contenteditable="true">
            <strong>FROM</strong>
            REEVES MUSKY<br>
            1945 Cedar Avenue<br>
            Austin, Texas 78701
          </div>
          <div class="label-shipper">
            <div style="font-size:9px;color:#8e8e93;font-weight:600;">SHIPPER</div>
            <div class="logo">SHIPPER<br>GLOBAL EXPRESS</div>
          </div>
        </div>
        <div class="label-to">
          <div class="label-to-text" contenteditable="true">
            <strong>TO</strong>
            Anita Vincent<br>
            4817 Friendly St.<br>
            Pace, Florida 32571
          </div>
          <div class="fl">FL</div>
        </div>
        <div class="label-barcode">
          <svg id="barcode"></svg>
          <div class="label-track-num" id="labelTrack">11861-87236-402392053</div>
        </div>
      </div>
      <div class="hint">Edit addresses • Enter any tracking number above and hit Track</div>
    </div>
  </div>

  <script>
    const input = document.getElementById('trackingInput');
    const card = document.getElementById('trackingCard');
    const timeline = document.getElementById('timeline');
    const etaText = document.getElementById('etaText');
    const labelSection = document.getElementById('labelSection');

    function renderBarcode(num) {
      const clean = (num || '000000').replace(/[^a-zA-Z0-9]/g, '');
      JsBarcode('#barcode', clean, {
        format: 'CODE128',
        width: 1.5,
        height: 42,
        displayValue: false,
        margin: 0,
        background: '#ffffff'
      });
      document.getElementById('labelTrack').textContent = num;
    }

    function doTrack() {
      const num = input.value.trim() || '11861-87236-402392053';
      renderBarcode(num);

      // Always show the exact professional In-Transit view from your screenshot
      etaText.textContent = 'By end of day';

      const steps = [
        {
          title: 'FROM: PEGGY PALMER',
          sub: '1201 THOMAS BLVD<br>TENNESSEE US',
          time: 'Label Created<br>8/19/26 9:00 AM',
          state: 'done'
        },
        {
          title: 'WE HAVE YOUR PACKAGE',
          sub: '',
          time: '',
          state: 'done'
        },
        {
          title: 'ON THE WAY',
          sub: 'DEFUNIAK SPRINGS, FL',
          time: '8/20/26 3:00 AM',
          state: 'done'
        },
        {
          title: 'OUT FOR DELIVERY',
          sub: 'DEFUNIAK SPRINGS, FL',
          time: '8/20/26 12:30 PM',
          state: 'current',
          link: true
        },
        {
          title: 'TO: PEGGY PALMER',
          sub: '1201 THOMAS BLVD<br>TENNESSEE US',
          time: 'By end of day [e.g., 8/20/26]',
          state: ''
        }
      ];

      let html = '<div class="timeline-progress" id="progressBar"></div>';
      steps.forEach((s) => {
        html += `
          <div class="step ${s.state}">
            <div class="dot"></div>
            <div class="step-title">${s.title}</div>
            ${s.sub ? `<div class="step-sub">${s.sub}</div>` : ''}
            ${s.time ? `<div class="step-time">${s.time}</div>` : ''}
            ${s.link ? `<a href="#" class="step-link" onclick="return false">View more details</a>` : ''}
          </div>`;
      });
      timeline.innerHTML = html;

      // Animate purple progress bar to current step
      setTimeout(() => {
        const current = timeline.querySelector('.step.current');
        const bar = document.getElementById('progressBar');
        if (current && bar) {
          bar.style.height = (current.offsetTop + 16) + 'px';
        }
      }, 60);

      card.classList.add('visible');
      labelSection.style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showLabel() {
      card.classList.remove('visible');
      labelSection.style.display = 'block';
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') doTrack();
    });

    renderBarcode(input.value);

    document.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('focus', () => el.style.outline = '2px solid #5e5ce6');
      el.addEventListener('blur', () => el.style.outline = 'none');
    });
  </script>
</body>
</html>
