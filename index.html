<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FedEx Tracking</title>
  <style>
    :root {
      --fedex-purple: #4D148C;
      --fedex-orange: #FF6600;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e0e0e0;
      --highlight: rgba(77, 20, 140, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top status bar (phone) ── */
    .status-bar {
      background: #000;
      color: #fff;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .status-bar .right { display: flex; gap: 6px; align-items: center; font-size: 12px; }

    /* ── Nav ── */
    .nav {
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 12px;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-title { font-size: 16px; font-weight: 500; }
    .nav-sub { font-size: 12px; opacity: 0.7; margin-top: 1px; }
    .nav-icons { display: flex; gap: 18px; font-size: 18px; opacity: 0.9; }

    /* ── FedEx Header ── */
    .fedex-header {
      background: var(--fedex-purple);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: Arial Black, Arial, sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
      display: flex;
      align-items: baseline;
    }
    .logo .orange { color: var(--fedex-orange); }
    .logo .reg { font-size: 10px; vertical-align: super; margin-left: 1px; }
    .backup-btn {
      background: #2a1a4a;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .menu-icon { color: #fff; font-size: 22px; cursor: pointer; }

    /* ── Main content ── */
    .page {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px 18px 80px;
      background: #fff;
    }

    .eta-label {
      font-size: 15px;
      color: #555;
      margin-bottom: 28px;
    }

    /* ── Timeline ── */
    .timeline {
      position: relative;
      padding-left: 36px;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 6px;
      bottom: 30px;
      width: 4px;
      background: #e8e8e8;
      border-radius: 4px;
    }
    .progress-line {
      position: absolute;
      left: 11px;
      top: 6px;
      width: 4px;
      background: var(--fedex-purple);
      border-radius: 4px;
      z-index: 1;
      transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .item {
      position: relative;
      padding-bottom: 28px;
    }
    .item:last-child { padding-bottom: 0; }

    .dot {
      position: absolute;
      left: -36px;
      top: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d0d0d0;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #d0d0d0;
      z-index: 2;
    }
    .item.done .dot {
      background: var(--fedex-purple);
      box-shadow: 0 0 0 2px var(--fedex-purple);
    }
    .item.current .dot {
      width: 32px;
      height: 32px;
      left: -45px;
      top: -4px;
      background: var(--fedex-purple);
      box-shadow: 0 0 0 6px rgba(77, 20, 140, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }
    .item.current .dot svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }
    .item.current {
      background: var(--highlight);
      margin: 0 -12px 8px;
      padding: 12px 14px 16px 48px;
      border-radius: 12px;
    }
    .item.current .dot { left: -33px; }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      color: #222;
    }
    .item.current .item-title { color: #111; }
    .item-loc {
      font-size: 14px;
      color: #333;
      margin-top: 3px;
      font-weight: 500;
    }
    .item-time {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    .item-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 14px;
      color: var(--fedex-purple);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .to-block {
      opacity: 0.55;
      margin-top: 8px;
    }
    .to-block .item-title { font-weight: 600; }

    /* ── Search (hidden by default, toggleable) ── */
    .search-toggle {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--fedex-purple);
      color: #fff;
      border: none;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(77,20,140,0.4);
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      padding: 20px 18px 32px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
      border-radius: 20px 20px 0 0;
      z-index: 60;
      max-width: 430px;
      margin: 0 auto;
    }
    .search-panel.open { display: block; }
    .search-panel input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    .search-panel input:focus { border-color: var(--fedex-purple); }
    .search-panel button {
      width: 100%;
      height: 48px;
      background: var(--fedex-purple);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .source {
      margin-top: 36px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <!-- Fake phone status bar -->
  <div class="status-bar">
    <span>8:46 PM</span>
    <div class="right">
      <span>LTE</span>
      <span>▮▮▮</span>
      <span>26</span>
    </div>
  </div>

  <!-- Black nav -->
  <div class="nav">
    <div class="nav-left">
      <span style="font-size:22px">←</span>
      <div>
        <div class="nav-title">Aug 14 ›</div>
        <div class="nav-sub">12:46 PM</div>
      </div>
    </div>
    <div class="nav-icons">
      <span>☆</span>
      <span>⋮</span>
    </div>
  </div>

  <!-- FedEx purple header -->
  <div class="fedex-header">
    <div class="logo">
      Fed<span class="orange">Ex</span><span class="reg">®</span>
    </div>
    <button class="backup-btn">☁ Back up now</button>
    <div class="menu-icon">☰</div>
  </div>

  <div class="page">
    <div class="eta-label" id="etaLabel">By end of day</div>

    <div class="timeline" id="timeline">
      <!-- filled by JS -->
    </div>

    <div class="source" id="source">Live network · Global Express</div>
  </div>

  <!-- Floating track button -->
  <button class="search-toggle" onclick="toggleSearch()" title="Track another">⌕</button>

  <div class="search-panel" id="searchPanel">
    <input id="tn" type="text" value="11881-87236-402382053" placeholder="Enter tracking number">
    <button onclick="track()">Track Package</button>
  </div>

  <script>
    const defaultEvents = [
      {
        title: "FROM",
        loc: "HOUSTON, TX US",
        time: "Label Created\n8/10/26 11:00 AM",
        state: "done"
      },
      {
        title: "WE HAVE YOUR PACKAGE",
        loc: "",
        time: "",
        state: "done"
      },
      {
        title: "ON THE WAY",
        loc: "DEFUNIAK SPRINGS, FL",
        time: "8/14/26 3:12 AM",
        state: "done"
      },
      {
        title: "OUT FOR DELIVERY",
        loc: "DEFUNIAK SPRINGS, FL",
        time: "8/14/26 3:33 AM",
        state: "current",
        link: true
      },
      {
        title: "TO",
        loc: "MILTON, FL US",
        time: "By end of day",
        state: "to"
      }
    ];

    function renderTimeline(events) {
      const tl = document.getElementById('timeline');
      let html = '<div class="progress-line" id="prog"></div>';

      events.forEach((e, i) => {
        const isTo = e.state === 'to';
        const cls = isTo ? 'item to-block' : `item ${e.state || ''}`;
        html += `
          <div class="${cls}">
            <div class="dot">${e.state === 'current' ? `<svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>` : ''}</div>
            <div class="item-title">${e.title}</div>
            ${e.loc ? `<div class="item-loc">${e.loc}</div>` : ''}
            ${e.time ? `<div class="item-time">${e.time.replace(/\n/g, '<br>')}</div>` : ''}
            ${e.link ? `<a href="#" class="item-link" onclick="return false">View more details</a>` : ''}
          </div>`;
      });

      tl.innerHTML = html;

      requestAnimationFrame(() => {
        const current = tl.querySelector('.item.current');
        const prog = document.getElementById('prog');
        if (current && prog) {
          prog.style.height = (current.offsetTop + 16) + 'px';
        }
      });
    }

    async function track() {
      const num = document.getElementById('tn').value.trim() || '11881-87236-402382053';
      document.getElementById('source').textContent = 'Querying live carrier network…';
      toggleSearch(false);

      try {
        const res = await fetch(`/api/track?number=${encodeURIComponent(num)}`);
        const data = await res.json();

        document.getElementById('etaLabel').textContent = data.isPreTransit ? 'Label created' : 'By end of day';
        document.getElementById('source').textContent = data.source || 'Live network';

        if (data.events && data.events.length) {
          const mapped = data.events.map((e, i) => {
            let state = e.state || '';
            if (!state) {
              if (i === data.events.length - 2) state = 'current';
              else if (i < data.events.length - 1) state = 'done';
              else state = 'to';
            }
            return {
              title: e.title || e.status || 'Update',
              loc: e.desc || e.location || '',
              time: e.time || '',
              state,
              link: !!e.link || state === 'current'
            };
          });
          renderTimeline(mapped);
        } else {
          renderTimeline(defaultEvents);
        }
      } catch (err) {
        console.error(err);
        document.getElementById('source').textContent = 'Offline mode · showing network snapshot';
        renderTimeline(defaultEvents);
      }
    }

    function toggleSearch(force) {
      const panel = document.getElementById('searchPanel');
      if (typeof force === 'boolean') {
        panel.classList.toggle('open', force);
      } else {
        panel.classList.toggle('open');
      }
    }

    // Boot with exact screenshot data
    renderTimeline(defaultEvents);
    document.getElementById('tn').addEventListener('keydown', e => {
      if (e.key === 'Enter') track();
    });
  </script>
</body>
</html>
